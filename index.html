<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Rohit ♡</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #2e1065, #581c87, #7e22ce, #3b0764);
            background-size: 400% 400%;
            animation: gradientShift 12s ease infinite;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .bg-heart {
            position: fixed;
            font-size: 1.5em;
            opacity: 0.25;
            color: #ffffff;
            animation: floatAround 18s ease-in-out infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes floatAround {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(80px, -80px); }
            50% { transform: translate(150px, 40px); }
            75% { transform: translate(-40px, -40px); }
        }

        /* Ivory Envelope Container */
        .envelope-container {
            cursor: pointer;
            perspective: 1000px;
            transition: transform 0.4s ease, opacity 0.6s ease;
            z-index: 20;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .envelope {
            width: 320px;
            height: 200px;
            background: #fdfbf7;
            border-radius: 12px;
            position: relative;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 25px rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(230, 225, 215, 0.8);
            overflow: visible;
        }

        /* Ivory Flap */
        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            border-left: 160px solid transparent;
            border-right: 160px solid transparent;
            border-top: 110px solid #f4efe6;
            transform-origin: top;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.15));
        }

        /* Heart Seal */
        .seal-heart {
            position: absolute;
            top: 95px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            font-size: 1.6rem;
            color: #7e22ce;
            transition: opacity 0.4s ease, transform 0.4s ease;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
            user-select: none;
        }

        /* Green Creepers & Nude Floral Elements */
        .floral-frame {
            position: absolute;
            top: -20px;
            left: -20px;
            right: -20px;
            bottom: -20px;
            pointer-events: none;
            z-index: 10;
        }

        .flower-cluster {
            position: absolute;
            width: 70px;
            height: 70px;
        }

        .flower-cluster.top-left {
            top: -5px;
            left: -5px;
        }

        .flower-cluster.bottom-right {
            bottom: -5px;
            right: -5px;
            transform: rotate(180deg);
        }

        /* Hover Animation */
        .envelope-container:hover .envelope-flap {
            transform: rotateX(160deg);
        }

        .envelope-container:hover {
            transform: scale(1.04);
        }

        /* Main Content Container */
        .container {
            text-align: center;
            padding: 50px 40px;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 28px;
            max-width: 550px;
            width: 90%;
            animation: cardGlow 5s ease-in-out infinite;
            border: 1px solid rgba(255, 255, 255, 0.6);
            position: relative;
            z-index: 10;
            display: none;
            opacity: 0;
            transform: scale(0.92) translateY(20px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .container.show {
            display: block;
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        @keyframes cardGlow {
            0%, 100% { box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2), 0 0 20px rgba(168, 85, 247, 0.3); }
            50% { box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25), 0 0 35px rgba(192, 132, 252, 0.6); }
        }

        #mainText {
            font-size: 2.2em;
            color: #3b0764;
            margin-bottom: 40px;
            font-weight: 500;
            letter-spacing: -0.5px;
            line-height: 1.4;
            transition: all 0.3s ease;
        }

        @media (max-width: 768px) {
            #mainText {
                font-size: 1.7em;
            }
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
            min-height: 180px;
            position: relative;
            padding: 10px;
        }

        button {
            font-family: inherit;
            font-size: 1.1em;
            padding: 16px 36px;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 500;
            letter-spacing: 0.3px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            position: relative;
        }

        #yesBtn {
            background: linear-gradient(135deg, #6b21a8, #a855f7);
            color: white;
            position: relative;
            z-index: 5;
            transform-origin: center center;
            animation: gentlePulse 2.8s ease-in-out infinite;
        }

        @keyframes gentlePulse {
            0%, 100% { transform: scale(var(--yes-scale, 1)); }
            50% { transform: scale(calc(var(--yes-scale, 1) * 1.03)); }
        }

        #yesBtn:hover {
            box-shadow: 0 10px 25px rgba(126, 34, 206, 0.45);
        }

        #noBtn {
            background: rgba(255, 255, 255, 0.9);
            color: #581c87;
            border: 1px solid rgba(126, 34, 206, 0.15);
            position: absolute;
            transition: all 0.2s ease-out;
            z-index: 10;
        }

        #subText {
            margin-top: 15px;
            font-size: 0.95em;
            color: #6b21a8;
            font-weight: 400;
            min-height: 24px;
            letter-spacing: 0.2px;
        }

        #finalMessage {
            font-size: 1.4em;
            color: #581c87;
            margin-top: 20px;
            font-weight: 600;
            letter-spacing: 0.5px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.8s ease;
        }

        #finalMessage.show {
            opacity: 1;
            transform: translateY(0);
        }

        .emoji-particle {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            user-select: none;
            animation: particleBlast 3.8s cubic-bezier(0.1, 0.6, 0.2, 1) forwards;
        }

        @keyframes particleBlast {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) translate(0, 0) scale(0.2) rotate(var(--tilt));
            }
            70% {
                opacity: 0.85;
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) translate(var(--dx), var(--dy)) scale(var(--scale)) rotate(var(--tilt));
            }
        }

        .shake {
            animation: softShake 0.4s ease;
        }

        @keyframes softShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
    </style>
</head>
<body>
    <div class="bg-heart" style="top: 15%; left: 12%; animation-delay: 0s;">💜</div>
    <div class="bg-heart" style="top: 75%; left: 82%; animation-delay: 1.5s;">💜</div>
    <div class="bg-heart" style="top: 35%; left: 85%; animation-delay: 3s;">💜</div>
    <div class="bg-heart" style="top: 65%; left: 18%; animation-delay: 4.5s;">💜</div>

    <!-- Opening Envelope with Floral & Creeper Design -->
    <div class="envelope-container" id="envelopeWrapper">
        <div class="envelope">
            <div class="envelope-flap" id="flap"></div>
            <div class="seal-heart">💜</div>
            
            <!-- Floral Frame Overlay -->
            <div class="floral-frame">
                <!-- Top Left Cluster -->
                <svg class="flower-cluster top-left" viewBox="0 0 100 100" fill="none">
                    <!-- Green Creeper Vines -->
                    <path d="M10 50 Q 30 10, 60 20 Q 80 25, 95 10" stroke="#4ade80" stroke-width="3" stroke-linecap="round" fill="none"/>
                    <path d="M5 30 Q 20 40, 40 15 Q 60 5, 80 25" stroke="#22c55e" stroke-width="2" stroke-linecap="round" fill="none"/>
                    
                    <!-- Vine Leaves -->
                    <path d="M25 25 C 20 15, 30 10, 35 20 C 30 25, 25 30, 25 25" fill="#4ade80"/>
                    <path d="M50 18 C 45 8, 55 5, 60 15 C 55 20, 50 22, 50 18" fill="#22c55e"/>
                    <path d="M70 20 C 65 10, 75 8, 80 18 C 75 22, 70 25, 70 20" fill="#15803d"/>

                    <!-- Aesthetic Nude Colored Flowers -->
                    <circle cx="20" cy="35" r="8" fill="#e8d5c4"/>
                    <circle cx="16" cy="30" r="5" fill="#f5ebe0"/>
                    <circle cx="24" cy="30" r="5" fill="#f5ebe0"/>
                    <circle cx="24" cy="40" r="5" fill="#f5ebe0"/>
                    <circle cx="16" cy="40" r="5" fill="#f5ebe0"/>
                    <circle cx="20" cy="35" r="3" fill="#d5bdaf"/>

                    <circle cx="55" cy="25" r="10" fill="#d5bdaf"/>
                    <circle cx="50" cy="18" r="6" fill="#e8d5c4"/>
                    <circle cx="60" cy="18" r="6" fill="#e8d5c4"/>
                    <circle cx="60" cy="32" r="6" fill="#e8d5c4"/>
                    <circle cx="50" cy="32" r="6" fill="#e8d5c4"/>
                    <circle cx="55" cy="25" r="4" fill="#b5927f"/>
                </svg>

                <!-- Bottom Right Cluster -->
                <svg class="flower-cluster bottom-right" viewBox="0 0 100 100" fill="none">
                    <!-- Green Creeper Vines -->
                    <path d="M10 50 Q 30 10, 60 20 Q 80 25, 95 10" stroke="#4ade80" stroke-width="3" stroke-linecap="round" fill="none"/>
                    <path d="M5 30 Q 20 40, 40 15 Q 60 5, 80 25" stroke="#22c55e" stroke-width="2" stroke-linecap="round" fill="none"/>
                    
                    <!-- Vine Leaves -->
                    <path d="M25 25 C 20 15, 30 10, 35 20 C 30 25, 25 30, 25 25" fill="#4ade80"/>
                    <path d="M50 18 C 45 8, 55 5, 60 15 C 55 20, 50 22, 50 18" fill="#22c55e"/>
                    <path d="M70 20 C 65 10, 75 8, 80 18 C 75 22, 70 25, 70 20" fill="#15803d"/>

                    <!-- Aesthetic Nude Colored Flowers -->
                    <circle cx="20" cy="35" r="8" fill="#e8d5c4"/>
                    <circle cx="16" cy="30" r="5" fill="#f5ebe0"/>
                    <circle cx="24" cy="30" r="5" fill="#f5ebe0"/>
                    <circle cx="24" cy="40" r="5" fill="#f5ebe0"/>
                    <circle cx="16" cy="40" r="5" fill="#f5ebe0"/>
                    <circle cx="20" cy="35" r="3" fill="#d5bdaf"/>

                    <circle cx="55" cy="25" r="10" fill="#d5bdaf"/>
                    <circle cx="50" cy="18" r="6" fill="#e8d5c4"/>
                    <circle cx="60" cy="18" r="6" fill="#e8d5c4"/>
                    <circle cx="60" cy="32" r="6" fill="#e8d5c4"/>
                    <circle cx="50" cy="32" r="6" fill="#e8d5c4"/>
                    <circle cx="55" cy="25" r="4" fill="#b5927f"/>
                </svg>
            </div>
        </div>
    </div>

    <!-- Main Card Container -->
    <div class="container" id="mainContainer">
        <div id="mainText">I'm really sorry, Rohit.<br>Can you forgive me?</div>
        <div class="buttons">
            <button id="yesBtn">Okay, I forgive you 💕</button>
            <button id="noBtn">Not yet</button>
        </div>
        <div id="subText"></div>
        <div id="finalMessage"></div>
    </div>

    <script>
        const envelopeWrapper = document.getElementById('envelopeWrapper');
        const flap = document.getElementById('flap');
        const mainContainer = document.getElementById('mainContainer');

        const mainText = document.getElementById('mainText');
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const subText = document.getElementById('subText');
        const finalMessage = document.getElementById('finalMessage');
        const buttonsContainer = document.querySelector('.buttons');

        envelopeWrapper.addEventListener('click', () => {
            flap.style.transform = 'rotateX(180deg)';
            envelopeWrapper.style.opacity = '0';
            
            setTimeout(() => {
                envelopeWrapper.style.display = 'none';
                mainContainer.classList.add('show');
                initNoButton();
            }, 600);
        });

        const sorryMessages = [
            "I'm really sorry, Rohit.<br>Can you forgive me 🥺?",
            "Rohit, I promise to do better.",
            "You mean so much to me, Rohit 💕",
            "I hate that I upset you 😔, Rohit.",
            "Please give me a chance to make it up to you.",
            "Life is so quiet without your smile, Rohit.",
            "I'm truly sorry, Rohit.",
            "I value you more than words can say 💖."
        ];

        let currentMessageIndex = 0;
        let noClickCount = 0;
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        function initNoButton() {
            const yesOffsetTop = yesBtn.offsetTop;
            const yesHeight = yesBtn.offsetHeight;
            const initialTop = yesOffsetTop + yesHeight + 15;
            
            noBtn.style.top = initialTop + 'px';
            noBtn.style.left = '50%';
            noBtn.style.transform = 'translateX(-50%) scale(1)';
            noClickCount = 0;
        }

        window.addEventListener('resize', () => {
            if (mainContainer.classList.contains('show')) {
                initNoButton();
            }
        });

        function moveNoButton() {
            const rect = buttonsContainer.getBoundingClientRect();
            const btnRect = noBtn.getBoundingClientRect();
            const yesRect = yesBtn.getBoundingClientRect();
            const maxX = rect.width - btnRect.width - 20;
            const maxY = rect.height - btnRect.height - 20;
            
            let newX, newY;
            let attempts = 0;
            
            do {
                newX = Math.random() * maxX + 10;
                newY = Math.random() * maxY + 10;
                attempts++;
                
                const noLeft = rect.left + newX;
                const noRight = noLeft + btnRect.width;
                const noTop = rect.top + newY;
                const noBottom = noTop + btnRect.height;
                
                const padding = 20;
                
                const overlaps = !(
                    noRight + padding < yesRect.left ||
                    noLeft - padding > yesRect.right ||
                    noBottom + padding < yesRect.top ||
                    noTop - padding > yesRect.bottom
                );
                
                if (!overlaps || attempts >= 40) break;
            } while (true);
            
            noBtn.style.left = newX + 'px';
            noBtn.style.top = newY + 'px';
            
            noClickCount++;
            const newScale = Math.max(0.5, 1 - (noClickCount * 0.08));
            noBtn.style.transform = `scale(${newScale})`;
        }

        function handleNoInteraction() {
            moveNoButton();
            
            const yesScale = 1 + (noClickCount * 0.15);
            yesBtn.style.setProperty('--yes-scale', yesScale);

            currentMessageIndex = (currentMessageIndex + 1) % sorryMessages.length;
            mainText.innerHTML = sorryMessages[currentMessageIndex];
            
            mainText.classList.add('shake');
            setTimeout(() => mainText.classList.remove('shake'), 400);

            if (noClickCount <= 3) {
                subText.innerHTML = "Please, Rohit?";
            } else {
                subText.innerHTML = "I'll keep trying until you say yes...";
            }
        }

        if (!isMobile) {
            noBtn.addEventListener('mouseenter', handleNoInteraction);
        }
        noBtn.addEventListener('click', function(e) {
            e.preventDefault();
            handleNoInteraction();
        });

        const heartEmojis = ['❤️', '💜', '🟣', '💕'];

        function createHeartParticle(originX, originY) {
            const particle = document.createElement('div');
            particle.className = 'emoji-particle';
            
            const selectedEmoji = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
            particle.textContent = selectedEmoji;
            
            const baseAngle = -10 + Math.random() * 200; 
            const rad = (baseAngle * Math.PI) / 180;
            
            const distance = Math.random() * 450 + 180;
            const dx = Math.cos(rad) * distance + 'px';
            const dy = -Math.sin(rad) * distance + 'px';
            
            const tilt = (Math.random() * 20 - 10) + 'deg';
            
            const isRedHeart = selectedEmoji === '❤️';
            const sizeMultiplier = isRedHeart ? 1.35 : 1.0;
            
            const scale = ((Math.random() * 0.8 + 0.45) * sizeMultiplier).toFixed(2);
            const fontSize = ((Math.random() * 0.8 + 1.0) * sizeMultiplier) + 'rem';

            particle.style.fontSize = fontSize;
            particle.style.left = originX + 'px';
            particle.style.top = originY + 'px';
            particle.style.setProperty('--dx', dx);
            particle.style.setProperty('--dy', dy);
            particle.style.setProperty('--scale', scale);
            particle.style.setProperty('--tilt', tilt);

            document.body.appendChild(particle);
            setTimeout(() => particle.remove(), 3800);
        }

        function spawnHeartBatch(x, y, count, timeSpanMs) {
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    createHeartParticle(x, y);
                }, Math.random() * timeSpanMs);
            }
        }

        yesBtn.addEventListener('click', function() {
            mainText.innerHTML = "Thank you, Rohit! ✨";
            buttonsContainer.style.display = 'none';
            subText.style.display = 'none';

            finalMessage.innerHTML = "I love you so much ♡";
            finalMessage.classList.add('show');

            const containerRect = document.querySelector('.container').getBoundingClientRect();
            const originX = containerRect.left + containerRect.width / 2;
            const originY = containerRect.top + containerRect.height / 2;

            spawnHeartBatch(originX, originY, 800, 1500);

            const heavyStream = setInterval(() => {
                spawnHeartBatch(originX, originY, 250, 400);
            }, 450);

            setTimeout(() => {
                clearInterval(heavyStream);
                
                let fadeCount = 180;
                const fadeInterval = setInterval(() => {
                    if (fadeCount <= 0) {
                        clearInterval(fadeInterval);
                        return;
                    }
                    spawnHeartBatch(originX, originY, fadeCount, 600);
                    fadeCount -= 15;
                }, 700);
            }, 5000);

            document.body.style.background = 'linear-gradient(-45deg, #1e1b4b, #3b0764, #581c87, #4c1d95)';
        });
    </script>
</body>
</html>
