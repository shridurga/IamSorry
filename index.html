<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Rohit ♡</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #2b32b2, #1488cc, #7b1fa2, #3f51b5);
            background-size: 400% 400%;
            animation: gradientShift 12s ease infinite;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .bg-heart {
            position: fixed;
            font-size: 1.4em;
            opacity: 0.25;
            color: #ffffff;
            animation: floatAround 18s ease-in-out infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes floatAround {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(80px, -80px); }
            50% { transform: translate(150px, 40px); }
            75% { transform: translate(-40px, -40px); }
        }

        .container {
            text-align: center;
            padding: 50px 40px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 28px;
            max-width: 550px;
            width: 90%;
            animation: floatIn 1.2s ease-out, cardGlow 5s ease-in-out infinite;
            border: 1px solid rgba(255, 255, 255, 0.6);
            position: relative;
            z-index: 10;
        }

        @keyframes floatIn {
            from {
                opacity: 0;
                transform: translateY(-30px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes cardGlow {
            0%, 100% { box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12), 0 0 20px rgba(255, 255, 255, 0.2); }
            50% { box-shadow: 0 20px 50px rgba(0, 0, 0, 0.16), 0 0 35px rgba(255, 255, 255, 0.45); }
        }

        #mainText {
            font-size: 2.2em;
            color: #2c3e50;
            margin-bottom: 40px;
            font-weight: 500;
            letter-spacing: -0.5px;
            line-height: 1.4;
            transition: all 0.3s ease;
        }

        @media (max-width: 768px) {
            #mainText {
                font-size: 1.7em;
            }
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
            min-height: 180px;
            position: relative;
            padding: 10px;
        }

        button {
            font-family: inherit;
            font-size: 1.1em;
            padding: 16px 36px;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 500;
            letter-spacing: 0.3px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            position: relative;
        }

        #yesBtn {
            background: linear-gradient(135deg, #2b32b2, #4a00e0);
            color: white;
            position: relative;
            z-index: 5;
            transform-origin: center center;
            animation: gentlePulse 2.8s ease-in-out infinite;
        }

        @keyframes gentlePulse {
            0%, 100% { transform: scale(var(--yes-scale, 1)); }
            50% { transform: scale(calc(var(--yes-scale, 1) * 1.03)); }
        }

        #yesBtn:hover {
            box-shadow: 0 10px 25px rgba(43, 50, 178, 0.4);
        }

        #noBtn {
            background: rgba(255, 255, 255, 0.9);
            color: #555;
            border: 1px solid rgba(0, 0, 0, 0.08);
            position: absolute;
            transition: all 0.2s ease-out;
            z-index: 10;
        }

        #subText {
            margin-top: 15px;
            font-size: 0.95em;
            color: #666;
            font-weight: 400;
            min-height: 24px;
            letter-spacing: 0.2px;
        }

        #finalMessage {
            font-size: 1.4em;
            color: #2b32b2;
            margin-top: 20px;
            font-weight: 600;
            letter-spacing: 0.5px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.8s ease;
        }

        #finalMessage.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Heart Particle - Behind card (z-index: 1) with upper arc trajectory */
        .emoji-particle {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            user-select: none;
            animation: particleBlast 3.4s cubic-bezier(0.12, 0.7, 0.25, 1) forwards;
        }

        @keyframes particleBlast {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) translate(0, 0) scale(0.3) rotate(var(--tilt));
            }
            65% {
                opacity: 0.9;
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) translate(var(--dx), var(--dy)) scale(var(--scale)) rotate(var(--tilt));
            }
        }

        .shake {
            animation: softShake 0.4s ease;
        }

        @keyframes softShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
    </style>
</head>
<body>
    <div class="bg-heart" style="top: 15%; left: 12%; animation-delay: 0s;">♡</div>
    <div class="bg-heart" style="top: 75%; left: 82%; animation-delay: 1.5s;">♥</div>
    <div class="bg-heart" style="top: 35%; left: 85%; animation-delay: 3s;">♡</div>
    <div class="bg-heart" style="top: 65%; left: 18%; animation-delay: 4.5s;">♥</div>

    <div class="container">
        <div id="mainText">I'm really sorry, Rohit.<br>Can you forgive me?</div>
        <div class="buttons">
            <button id="yesBtn">Okay, I forgive you 💕</button>
            <button id="noBtn">Not yet</button>
        </div>
        <div id="subText"></div>
        <div id="finalMessage"></div>
    </div>

    <script>
        const mainText = document.getElementById('mainText');
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const subText = document.getElementById('subText');
        const finalMessage = document.getElementById('finalMessage');
        const buttonsContainer = document.querySelector('.buttons');

        const sorryMessages = [
            "I'm really sorry, Rohit.<br>Can you forgive me 🥺?",
            "Rohit, I promise to do better.",
            "You mean so much to me, Rohit 💕",
            "I hate that I upset you 😔, Rohit.",
            "Please give me a chance to make it up to you.",
            "Life is so quiet without your smile, Rohit.",
            "I'm truly sorry, Rohit.",
            "I value you more than words can say 💖."
        ];

        let currentMessageIndex = 0;
        let noClickCount = 0;
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        function initNoButton() {
            const yesOffsetTop = yesBtn.offsetTop;
            const yesHeight = yesBtn.offsetHeight;
            const initialTop = yesOffsetTop + yesHeight + 15;
            
            noBtn.style.top = initialTop + 'px';
            noBtn.style.left = '50%';
            noBtn.style.transform = 'translateX(-50%) scale(1)';
            noClickCount = 0;
        }

        initNoButton();
        window.addEventListener('resize', initNoButton);

        function moveNoButton() {
            const rect = buttonsContainer.getBoundingClientRect();
            const btnRect = noBtn.getBoundingClientRect();
            const yesRect = yesBtn.getBoundingClientRect();
            const maxX = rect.width - btnRect.width - 20;
            const maxY = rect.height - btnRect.height - 20;
            
            let newX, newY;
            let attempts = 0;
            
            do {
                newX = Math.random() * maxX + 10;
                newY = Math.random() * maxY + 10;
                attempts++;
                
                const noLeft = rect.left + newX;
                const noRight = noLeft + btnRect.width;
                const noTop = rect.top + newY;
                const noBottom = noTop + btnRect.height;
                
                const padding = 20;
                
                const overlaps = !(
                    noRight + padding < yesRect.left ||
                    noLeft - padding > yesRect.right ||
                    noBottom + padding < yesRect.top ||
                    noTop - padding > yesRect.bottom
                );
                
                if (!overlaps || attempts >= 40) break;
            } while (true);
            
            noBtn.style.left = newX + 'px';
            noBtn.style.top = newY + 'px';
            
            noClickCount++;
            const newScale = Math.max(0.5, 1 - (noClickCount * 0.08));
            noBtn.style.transform = `scale(${newScale})`;
        }

        function handleNoInteraction() {
            moveNoButton();
            
            const yesScale = 1 + (noClickCount * 0.15);
            yesBtn.style.setProperty('--yes-scale', yesScale);

            currentMessageIndex = (currentMessageIndex + 1) % sorryMessages.length;
            mainText.innerHTML = sorryMessages[currentMessageIndex];
            
            mainText.classList.add('shake');
            setTimeout(() => mainText.classList.remove('shake'), 400);

            if (noClickCount <= 3) {
                subText.innerHTML = "Please, Rohit?";
            } else {
                subText.innerHTML = "I'll keep trying until you say yes...";
            }
        }

        if (!isMobile) {
            noBtn.addEventListener('mouseenter', handleNoInteraction);
        }
        noBtn.addEventListener('click', function(e) {
            e.preventDefault();
            handleNoInteraction();
        });

        function createHeartParticle(originX, originY) {
            const particle = document.createElement('div');
            particle.className = 'emoji-particle';
            particle.textContent = '❤️';
            
            // Upper semi-circle range: -10 degrees to +190 degrees
            const baseAngle = -10 + Math.random() * 200; 
            const rad = (baseAngle * Math.PI) / 180;
            
            // Distance radiating outward in slow motion
            const distance = Math.random() * 400 + 180;
            const dx = Math.cos(rad) * distance + 'px';
            const dy = -Math.sin(rad) * distance + 'px'; // Negative to point upwards
            
            // Subtle random tilt along the radial path
            const tilt = (Math.random() * 24 - 12) + 'deg';
            
            const scale = (Math.random() * 1.5 + 0.6).toFixed(2);
            const fontSize = (Math.random() * 1.6 + 1.2) + 'rem';

            particle.style.fontSize = fontSize;
            particle.style.left = originX + 'px';
            particle.style.top = originY + 'px';
            particle.style.setProperty('--dx', dx);
            particle.style.setProperty('--dy', dy);
            particle.style.setProperty('--scale', scale);
            particle.style.setProperty('--tilt', tilt);

            document.body.appendChild(particle);
            setTimeout(() => particle.remove(), 3400);
        }

        function triggerUpperSemiCircleBlast(x, y, count = 90) {
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    createHeartParticle(x, y);
                }, Math.random() * 900);
            }
        }

        yesBtn.addEventListener('click', function() {
            mainText.innerHTML = "Thank you, Rohit! ✨";
            buttonsContainer.style.display = 'none';
            subText.style.display = 'none';

            finalMessage.innerHTML = "I love you so much ♡";
            finalMessage.classList.add('show');

            const containerRect = document.querySelector('.container').getBoundingClientRect();
            const originX = containerRect.left + containerRect.width / 2;
            const originY = containerRect.top + containerRect.height / 2;

            // Initial burst outward in upper semi-circle
            triggerUpperSemiCircleBlast(originX, originY, 130);

            // Continuous slow-motion stream from center
            setInterval(() => {
                triggerUpperSemiCircleBlast(originX, originY, 25);
            }, 750);

            document.body.style.background = 'linear-gradient(-45deg, #1e3c72, #2a5298, #6b5b95, #3f51b5)';
        });
    </script>
</body>
</html>
